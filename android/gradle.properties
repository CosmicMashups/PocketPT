org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.unsafe.watch-fs=false
org.gradle.parallel=true
org.gradle.configureondemand=true
# Fix for Windows path issues with spaces
org.gradle.caching=false
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
# Additional memory optimizations
org.gradle.workers.max=4
